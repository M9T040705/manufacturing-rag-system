# 制造业 RAG 系统 Docker Compose 部署配置
# 包含：RAG 应用、Milvus 向量库、Redis 缓存、vLLM 推理服务

version: "3.8"

services:
  # ===== RAG 应用服务 =====
  rag-app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: manufacturing-rag-app
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - APP_ENV=production
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_API_BASE=http://vllm:8001/v1
      - EMBEDDING_DEVICE=cuda
      - RERANKER_DEVICE=cuda
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
      - ../../logs:/app/logs
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

  # ===== Milvus 向量库 =====
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: manufacturing-rag-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus 依赖：etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: manufacturing-rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus 依赖：minio
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: manufacturing-rag-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: manufacturing-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - rag-network

  # ===== vLLM 推理服务（可选，也可单独部署） =====
  vllm:
    image: vllm/vllm-openai:v0.6.0
    container_name: manufacturing-rag-vllm
    ports:
      - "8001:8001"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../../models:/models
    command: >
      --model /models/Qwen2.5-14B-Instruct
      --served-model-name Qwen2.5-14B-Instruct
      --host 0.0.0.0
      --port 8001
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

# ===== 数据卷 =====
volumes:
  milvus_data:
  etcd_data:
  minio_data:
  redis_data:

# ===== 网络 =====
networks:
  rag-network:
    driver: bridge
